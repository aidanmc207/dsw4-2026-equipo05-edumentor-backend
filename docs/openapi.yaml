openapi: 3.0.3
info:
  title: EduMentor Hub API
  description: API REST de la plataforma de tutorías entre pares del Equipo 05.
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Desarrollo local
tags:
  - name: Autenticación
  - name: Materias
  - name: Evaluaciones
  - name: Recursos
security:
  - bearerAuth: []

paths:
  /api/auth/login:
    post:
      tags: [Autenticación]
      summary: Iniciar sesión
      description: Devuelve el token JWT que se manda en el encabezado Authorization.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Credenciales correctas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '401':
          description: Correo o contraseña incorrectos
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/auth/registro:
    post:
      tags: [Autenticación]
      summary: Crear una cuenta
      description: Solo permite los roles ESTUDIANTE y TUTOR. Al registrarse ya devuelve el token.
      operationId: registrar
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistroRequest'
      responses:
        '201':
          description: Cuenta creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '409':
          description: El correo o el carné ya están registrados
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/sesiones/{sesionId}/evaluacion:
    post:
      tags: [Evaluaciones]
      summary: Evaluar una sesión
      description: >
        Solo el estudiante de la sesión puede evaluarla, y solo cuando está en estado COMPLETED.
        Al guardar, la sesión pasa a REVIEWED y se recalcula el promedio del tutor.
      operationId: crearEvaluacion
      parameters:
        - $ref: '#/components/parameters/SesionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluacionRequest'
      responses:
        '201':
          description: Evaluación creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluacionResponse'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
    get:
      tags: [Evaluaciones]
      summary: Consultar la evaluación de una sesión
      operationId: obtenerEvaluacionPorSesion
      parameters:
        - $ref: '#/components/parameters/SesionId'
      responses:
        '200':
          description: Evaluación de la sesión
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluacionResponse'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'

  /api/tutores/{tutorId}/evaluaciones:
    get:
      tags: [Evaluaciones]
      summary: Listar las evaluaciones de un tutor
      description: Alimenta el perfil del tutor. El promedio y el total se leen del usuario.
      operationId: listarEvaluacionesDeTutor
      parameters:
        - name: tutorId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Evaluaciones recibidas por el tutor
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EvaluacionResponse'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/NoEncontrado'

  /api/sesiones/{sesionId}/recursos:
    get:
      tags: [Recursos]
      summary: Listar los recursos de una sesión
      operationId: listarRecursosDeSesion
      parameters:
        - $ref: '#/components/parameters/SesionId'
      responses:
        '200':
          description: Recursos de la sesión
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RecursoResponse'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
    post:
      tags: [Recursos]
      summary: Agregar un enlace a una sesión
      description: Solo el tutor de la sesión puede agregar recursos. Los recursos son enlaces, no archivos.
      operationId: crearRecurso
      parameters:
        - $ref: '#/components/parameters/SesionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecursoRequest'
      responses:
        '201':
          description: Recurso creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecursoResponse'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'

  /api/recursos/{recursoId}:
    delete:
      tags: [Recursos]
      summary: Eliminar un recurso
      operationId: eliminarRecurso
      parameters:
        - name: recursoId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Recurso eliminado
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'

  /api/materias:
    get:
      tags: [Materias]
      summary: Listar el catálogo de materias
      description: Disponible para cualquier usuario autenticado. Se ordena por nombre.
      operationId: listarMaterias
      responses:
        '200':
          description: Catálogo de materias
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MateriaResponse'
        '401':
          $ref: '#/components/responses/NoAutenticado'
    post:
      tags: [Materias]
      summary: Crear una materia
      description: Solo el coordinador. El código se guarda en mayúscula y no se puede repetir.
      operationId: crearMateria
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MateriaRequest'
      responses:
        '201':
          description: Materia creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MateriaResponse'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '409':
          $ref: '#/components/responses/Conflicto'

  /api/materias/{materiaId}:
    parameters:
      - name: materiaId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags: [Materias]
      summary: Consultar una materia
      operationId: obtenerMateria
      responses:
        '200':
          description: Materia encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MateriaResponse'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
    put:
      tags: [Materias]
      summary: Editar una materia
      description: Solo el coordinador.
      operationId: actualizarMateria
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MateriaRequest'
      responses:
        '200':
          description: Materia actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MateriaResponse'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
    delete:
      tags: [Materias]
      summary: Eliminar una materia
      description: Solo el coordinador.
      operationId: eliminarMateria
      responses:
        '204':
          description: Materia eliminada
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    SesionId:
      name: sesionId
      in: path
      required: true
      schema:
        type: integer
        format: int64

  schemas:
    ProblemDetails:
      type: object
      description: Error según RFC 7807.
      required: [title, status]
      properties:
        type:
          type: string
          format: uri-reference
          example: about:blank
        title:
          type: string
          example: Solicitud inválida
        status:
          type: integer
          example: 400
        detail:
          type: string
          example: La calificación debe estar entre 1 y 5.
        instance:
          type: string
          example: /api/sesiones/12/evaluacion
        errores:
          type: array
          description: Errores por campo, solo en validaciones.
          items:
            type: object
            required: [campo, mensaje]
            properties:
              campo:
                type: string
                example: calificacionEstrellas
              mensaje:
                type: string
                example: debe ser mayor o igual a 1

    EvaluacionRequest:
      type: object
      required: [calificacionEstrellas]
      properties:
        calificacionEstrellas:
          type: integer
          minimum: 1
          maximum: 5
        comentario:
          type: string
          maxLength: 500

    EvaluacionResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        sesionId:
          type: integer
          format: int64
        calificacionEstrellas:
          type: integer
          minimum: 1
          maximum: 5
        comentario:
          type: string
        fechaEvaluacion:
          type: string
          format: date-time

    RecursoRequest:
      type: object
      required: [titulo, urlRecurso]
      properties:
        titulo:
          type: string
          maxLength: 150
        urlRecurso:
          type: string
          format: uri
          maxLength: 500

    RecursoResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        sesionId:
          type: integer
          format: int64
        titulo:
          type: string
        urlRecurso:
          type: string
          format: uri

    MateriaRequest:
      type: object
      required: [codigoMateria, nombreMateria, carrera, creditos]
      properties:
        codigoMateria:
          type: string
          maxLength: 10
          example: IF2000
        nombreMateria:
          type: string
          maxLength: 100
          example: Programación I
        carrera:
          type: string
          maxLength: 100
          example: Informática Empresarial
        creditos:
          type: integer
          minimum: 1
          maximum: 12
          example: 4

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: estudiante@ucr.ac.cr
        password:
          type: string
          example: Edumentor2026

    RegistroRequest:
      type: object
      required: [carne, email, password, nombre, apellido, rol]
      properties:
        carne:
          type: string
          maxLength: 20
          example: C21111
        email:
          type: string
          format: email
          maxLength: 120
        password:
          type: string
          minLength: 8
        nombre:
          type: string
          maxLength: 60
        apellido:
          type: string
          maxLength: 60
        rol:
          type: string
          enum: [ESTUDIANTE, TUTOR]

    LoginResponse:
      type: object
      properties:
        token:
          type: string
        rol:
          type: string
          enum: [ESTUDIANTE, TUTOR, COORDINADOR]
        nombre:
          type: string

    MateriaResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        codigoMateria:
          type: string
        nombreMateria:
          type: string
        carrera:
          type: string
        creditos:
          type: integer

  responses:
    SolicitudInvalida:
      description: Datos inválidos
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NoAutenticado:
      description: Falta el token o no es válido
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    SinPermiso:
      description: El rol o el usuario no tiene permiso
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NoEncontrado:
      description: El recurso no existe
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Conflicto:
      description: La operación no es válida en el estado actual
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'